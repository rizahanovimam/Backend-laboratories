<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css" integrity="sha384-CfCrinSRH2IR6a4e6fy2q6ioOX7O6Mtm1L9vRvFZ1trBncWmMePhzvafv7oIcWiW" crossorigin="anonymous">
    <title>{{title}}</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Navbar</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="/">Добавить новость</a></li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container mt-3">
        <h1> {{title}} </h1>
        {% now 'Y-m-d H:i:s' %}
        
        <div class="row">
            {% for item in news %}
            <div class="col-md-12">
                <div class="card mb-3">
                    <h5 class="card-header">
                        {{forloop.counter}}
                        {{item.my_func}}
                        Категория {{item.category}}
                    </h5>

                    <div class="card-body">
                        <div class="media">
                            {% if item.photo %}
                                <img src="{{item.photo.url}}" alt=" " class="mr-3" width="300">
                            {% else %}
                                <img src="https://picsum.photos/200/300/?blur=2" alt=" " class="mr-3" width="300">
                            {% endif %}
                            
                            <div class="media-body">
                                <h5 class="card-title {% cycle 'text-danger' 'text-success' %}"> {{item.title}} </h5>
                                <p class="card-text"> {{item.content}} </p>
                                <a href="#" class="btn btn-primary">Read more...</a>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer text-body-secondary">
                        {{item.created_at|date:"Y-m-d"}}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    
  </body>
</html>
